<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only
     Barge browser simulator. The WebAssembly/AudioWorklet structure is adapted from Felucca's emulator,
     which follows the X0X browser simulator; see LICENSING.md for upstream credits. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Barge FM-1 firmware simulator, running the Barge application in WebAssembly.">
<title>Barge FM-1 Simulator</title>
<style>
:root { color-scheme: dark; --ink:#eff7f4; --muted:#91aaa9; --panel:#17242a; --well:#0d171b; --edge:#2b4147; --teal:#53d2bd; --amber:#e5aa63; --paper:#e9eeee; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% -20%,#31535b 0,#15262d 45%,#0a1217 100%); color:var(--ink); font:15px/1.45 system-ui,sans-serif; }
main { max-width:1080px; margin:auto; padding:32px 20px 48px; }
header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:22px; }
h1 { margin:0; font-size:clamp(1.7rem,4vw,2.6rem); letter-spacing:.16em; font-weight:800; }
header p { margin:4px 0 0; color:var(--muted); }
.badge { border:1px solid var(--edge); color:var(--teal); border-radius:999px; padding:7px 12px; font-size:.8rem; white-space:nowrap; }
.device { display:grid; grid-template-columns:minmax(290px,1fr) minmax(320px,1.1fr); gap:18px; background:linear-gradient(145deg,#202f35,#111d22); border:1px solid #385057; padding:clamp(16px,3vw,30px); border-radius:28px; box-shadow:0 28px 80px #0008,inset 0 1px #ffffff12; }
.display-wrap { display:grid; place-items:center; background:var(--well); border-radius:20px; padding:18px; min-height:330px; position:relative; }
canvas { width:min(100%,300px); aspect-ratio:1; image-rendering:pixelated; background:#000; border:7px solid #29383c; border-radius:14px; box-shadow:0 0 35px #0009; }
.overlay { position:absolute; inset:0; display:grid; place-items:center; background:#081115d9; border-radius:20px; text-align:center; padding:20px; }
.overlay[hidden] { display:none; }
.overlay button { border:0; border-radius:12px; background:var(--teal); color:#06201f; padding:13px 22px; font-weight:800; font-size:1rem; cursor:pointer; }
.overlay button:disabled { opacity:.55; cursor:wait; }
#status { color:var(--muted); min-height:1.5em; margin:12px 0 0; }
.controls { display:grid; align-content:start; gap:16px; }
.control-section { background:var(--well); border:1px solid #20343a; border-radius:16px; padding:16px; }
.control-section h2 { color:var(--muted); font-size:.76rem; letter-spacing:.14em; text-transform:uppercase; margin:0 0 12px; }
.master { display:grid; grid-template-columns:80px 1fr 36px; align-items:center; gap:10px; font-size:.85rem; }
input[type=range] { accent-color:var(--teal); width:100%; }
.buttons { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
button.panel-button,.encoder button { border:1px solid var(--edge); border-radius:9px; min-height:39px; background:#22343a; color:var(--ink); font-weight:650; cursor:pointer; touch-action:none; }
button.panel-button:hover,.encoder button:hover { border-color:var(--teal); }
button.panel-button.pressed { background:var(--teal); color:#09221f; }
button.panel-button.led { border-color:var(--teal); box-shadow:0 0 12px #53d2bd55; }
.key.led { outline:2px solid var(--teal); box-shadow:0 0 10px #53d2bd77; }
.encoders { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; }
.encoder { display:grid; grid-template-columns:1fr 1fr; gap:4px; text-align:center; }
.encoder span { grid-column:1/-1; color:var(--muted); font-size:.73rem; letter-spacing:.06em; }
.encoder button { min-height:32px; }
.keyboard { display:grid; grid-template-columns:repeat(14,minmax(0,1fr)); gap:5px; background:var(--well); border:1px solid #20343a; border-radius:16px; padding:12px; }
.key { min-height:78px; border:1px solid #b8c6c4; border-radius:5px 5px 9px 9px; background:var(--paper); color:#18262a; font-size:.64rem; font-weight:700; cursor:pointer; touch-action:none; display:flex; align-items:end; justify-content:center; padding:5px 1px; }
.key.black { background:#1a282c; color:#d9e5e2; border-color:#40565a; min-height:58px; }
.key.pressed { background:var(--amber); color:#20201a; }
footer { color:var(--muted); text-align:center; font-size:.82rem; padding:22px 0 0; }
@media(max-width:760px) { main{padding:18px 10px 28px}.device{grid-template-columns:1fr;border-radius:20px}.display-wrap{min-height:290px}.buttons{grid-template-columns:repeat(4,1fr)}.keyboard{grid-template-columns:repeat(9,minmax(0,1fr))}.key{min-height:60px}.encoders{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<main>
<header><div><h1>BARGE</h1><p>FM-1 application simulator · WebAssembly</p></div><span class="badge" id="runstate">POWER OFF</span></header>
<section class="device" aria-label="Barge virtual FM-1">
  <div class="display-wrap"><canvas id="screen" width="240" height="240" aria-label="Barge LCD"></canvas>
    <div class="overlay" id="overlay"><div><button id="power">Power on Barge</button><p id="status">Loads the Barge baseline in your browser.</p></div></div>
  </div>
  <div class="controls">
    <div class="control-section"><h2>Master</h2><label class="master">LEVEL<input id="master" type="range" min="0" max="1023" value="700"><output id="master-value">700</output></label></div>
    <div class="control-section"><h2>Panel buttons · hold to press</h2><div class="buttons" id="buttons"></div></div>
    <div class="control-section"><h2>Encoders</h2><div class="encoders" id="encoders"></div></div>
  </div>
</section>
<section class="control-section" style="margin-top:18px"><h2>Keyboard · hold a key</h2><div class="keyboard" id="keyboard"></div></section>
<footer>Barge is GPL-3.0-only · Simulates Barge's app, not the AC79 hardware · No update/flash operations are emulated.</footer>
</main>
<script type="module">
const BUTTONS = ["OCT-","OCT+","FX","SEL","ENV","LFO","EDIT","GLO","HOME","SAVE","ARP","SEQ","PLAY","REC"];
const ENCODERS = ["SELECT","ALGORITHM","KNOB 1","KNOB 2","KNOB 3","KNOB 4","PRESETS"];
const NOTES = ["F3","F♯3","G3","G♯3","A3","A♯3","B3","C4","C♯4","D4","D♯4","E4","F4","F♯4","G4","G♯4","A4","A♯4","B4","C5","C♯5","D5","D♯5","E5","F5","F♯5","G5"];
const BLACK = new Set([1,3,5,8,10,13,15,17,20,22,25]);
const $ = (id) => document.getElementById(id);
const buttonBox = $("buttons"), encoderBox = $("encoders"), keyboard = $("keyboard"), canvas = $("screen"), ctx = canvas.getContext("2d");
const buttonNodes = [], keyNodes = [];
let node, audio, buttonMask = 0, keyMask = 0;
const bit = (i) => (1 << i) >>> 0;
function heldButton(el, id) {
  const down = (e) => { e.preventDefault(); buttonMask |= bit(id); node?.port.postMessage({type:"buttons",mask:buttonMask}); el.classList.add("pressed"); el.setPointerCapture?.(e.pointerId); };
  const up = (e) => { e.preventDefault(); buttonMask &= ~bit(id); node?.port.postMessage({type:"buttons",mask:buttonMask}); el.classList.remove("pressed"); };
  el.addEventListener("pointerdown",down); el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up); el.addEventListener("lostpointercapture",up);
}
BUTTONS.forEach((name,id)=>{const b=document.createElement("button");b.className="panel-button";b.textContent=name;heldButton(b,id);buttonNodes.push(b);buttonBox.append(b);});
ENCODERS.forEach((name,role)=>{const wrap=document.createElement("div");wrap.className="encoder";const label=document.createElement("span");label.textContent=name;const less=document.createElement("button"),more=document.createElement("button");less.textContent="−";more.textContent="+";less.setAttribute("aria-label",name+" counter-clockwise");more.setAttribute("aria-label",name+" clockwise");less.onclick=()=>node?.port.postMessage({type:"encoder",role,delta:-1});more.onclick=()=>node?.port.postMessage({type:"encoder",role,delta:1});wrap.append(label,less,more);encoderBox.append(wrap);});
NOTES.forEach((name,index)=>{const k=document.createElement("button");k.className="key"+(BLACK.has(index)?" black":"");k.textContent=name;k.setAttribute("aria-label",name);const down=(e)=>{e.preventDefault();keyMask|=bit(index);node?.port.postMessage({type:"keys",mask:keyMask});k.classList.add("pressed");k.setPointerCapture?.(e.pointerId);};const up=(e)=>{e.preventDefault();keyMask&=~bit(index);node?.port.postMessage({type:"keys",mask:keyMask});k.classList.remove("pressed");};k.addEventListener("pointerdown",down);k.addEventListener("pointerup",up);k.addEventListener("pointercancel",up);k.addEventListener("lostpointercapture",up);keyNodes.push(k);keyboard.append(k);});
$("master").addEventListener("input",(e)=>{$("master-value").value=e.target.value;node?.port.postMessage({type:"master",value:+e.target.value});});
function showScreen(pixels){const image=ctx.createImageData(240,240),dst=image.data;for(let i=0,j=0;i<pixels.length;i++,j+=4){const p=pixels[i];dst[j]=((p>>11)&31)*255/31;dst[j+1]=((p>>5)&63)*255/63;dst[j+2]=(p&31)*255/31;dst[j+3]=255;}ctx.putImageData(image,0,0);}
function savedSettings(){try{return JSON.parse(localStorage.getItem("barge-settings")||"null");}catch{return null;}}
$("power").addEventListener("click",async()=>{
  const button=$("power"),status=$("status");button.disabled=true;status.textContent="Starting the Barge WebAssembly audio engine…";
  try{audio=new AudioContext({sampleRate:44100});await audio.audioWorklet.addModule("./worklet.js");node=new AudioWorkletNode(audio,"barge",{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});node.port.onmessage=(e)=>{const m=e.data;if(m.type==="ready"){status.textContent=`Running at ${m.rate} Hz · host-simulated panel and audio`;$ ("runstate").textContent="RUNNING";$("overlay").hidden=true;node.port.postMessage({type:"master",value:+$("master").value});}else if(m.type==="error"){status.textContent=m.message;button.disabled=false;}else if(m.type==="frame"){if(m.screen)showScreen(m.screen);if(m.settings)localStorage.setItem("barge-settings",JSON.stringify(m.settings));if(m.ledButtons!==undefined)buttonNodes.forEach((el,i)=>el.classList.toggle("led",!!(m.ledButtons&bit(i))));if(m.ledKeys!==undefined)keyNodes.forEach((el,i)=>el.classList.toggle("led",!!(m.ledKeys&bit(i))));}};
    const response=await fetch("./barge.wasm");if(!response.ok)throw new Error("Could not load barge.wasm");const wasm=await response.arrayBuffer();node.port.postMessage({type:"load",wasm,settings:savedSettings()},[wasm]);node.connect(audio.destination);await audio.resume();
  }catch(error){status.textContent=String(error?.message||error);button.disabled=false;}
});
</script>
</body>
</html>
